name: Build and push Docker image

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'docker/base-image/**'
      - 'docker/build-image/**'
      - '.github/workflows/docker-build-image.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'docker/base-image/**'
      - 'docker/build-image/**'
      - '.github/workflows/docker-build-image.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # Видно в логе "Set up job" — сразу понятно, что применилась новая версия файла.
      KNP_IMAGE_VERSION: ${{ vars.KNP_BASE_IMAGE_VERSION || 'v2.0.93' }}
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Опционально: if: false, если base-image не менялся.
      - name: Build and push the base Docker image for Kaspersky Neuromorphic Platform
        uses: docker/build-push-action@v7
        timeout-minutes: 180
        continue-on-error: false
        with:
          platforms: linux/amd64,linux/arm64
          context: "{{defaultContext}}:docker/base-image"
          push: true
          tags: |
            ${{ vars.DOCKERHUB_LOGIN }}/knp-base-image:${{ env.KNP_IMAGE_VERSION }}
            ${{ vars.DOCKERHUB_LOGIN }}/knp-base-image:latest
          build-args: KNP_IMAGE_VERSION=${{ env.KNP_IMAGE_VERSION }}

      - name: Build and push the Docker image for Kaspersky Neuromorphic Platform build
        uses: docker/build-push-action@v7
        timeout-minutes: 180
        continue-on-error: false
        with:
          platforms: linux/amd64,linux/arm64
          context: "{{defaultContext}}:docker/build-image"
          push: true
          build-args: KNP_IMAGE_VERSION=${{ env.KNP_IMAGE_VERSION }}
          tags: |
            ${{ vars.DOCKERHUB_LOGIN }}/knp-build-image:${{ env.KNP_IMAGE_VERSION }}
            ${{ vars.DOCKERHUB_LOGIN }}/knp-build-image:latest
